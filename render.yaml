services:
  - type: web
    name: sm-office-desk
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: SQLITE_PATH
        value: /data/office.db
      - key: LOCAL_STORAGE_PATH
        value: /data/screenshots
      - key: JWT_SECRET
        value: 9f8a3c4b1e5d7f6a8b2c4d6e8f0a2c4e6a8b0c2d4e6f8a0b2c4d6e8f0a2c4e6a
      - key: COMPANY_NAME
        value: SM Office Desk
      - key: COMPANY_TIMEZONE
        value: Asia/Dhaka
      - key: CURRENCY_CODE
        value: BDT
      - key: SEED_ADMIN_NAME
        value: Administrator
      - key: SEED_ADMIN_EMAIL
        value: admin@sm-desk-tracker.com
      - key: SEED_ADMIN_PASSWORD
        value: SM@admin&123
