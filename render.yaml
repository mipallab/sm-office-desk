services:
  - type: web
    name: sm-office-desk
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: SQLITE_PATH
        value: /opt/render/project/src/office.db
      - key: LOCAL_STORAGE_PATH
        value: /opt/render/project/src/screenshots
      - key: JWT_SECRET
        generateValue: true
      - key: COMPANY_NAME
        value: SM Office Desk
      - key: COMPANY_TIMEZONE
        value: Asia/Dhaka
      - key: CURRENCY_CODE
        value: BDT
      - key: SEED_ADMIN_NAME
        value: Administrator
      - key: SEED_ADMIN_EMAIL
        value: admin@sm-desk-tracker.com
      - key: SEED_ADMIN_PASSWORD
        value: SM@admin&123
